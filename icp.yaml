# yaml-language-server: $schema=https://raw.githubusercontent.com/dfinity/icp-cli/main/docs/schemas/icp-yaml-schema.json

canisters:
  - name: relationship_backend
    recipe:
      type: "@dfinity/rust@v3.3.0"
      configuration:
        package: Relationship-Smart-Contract-ICP-backend
        candid: src/Relationship-Smart-Contract-ICP-backend/relationship_backend.did

  - name: relationship_frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: src/Relationship-Smart-Contract-ICP-frontend/dist
        build:
          - npm ci
          - npm run build --workspace Relationship-Smart-Contract-ICP-frontend

networks:
  - name: local
    mode: managed
    ii: true

environments:
  - name: local
    network: local
    canisters:
      - relationship_backend
      - relationship_frontend

  - name: ic
    network: ic
    canisters:
      - relationship_backend
      - relationship_frontend
